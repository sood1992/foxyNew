---
deployment:
  tasks:
    - /bin/cp -R * /home/neofoxme/public_html/foxy/
    - /bin/cp -R api /home/neofoxme/public_html/foxy/
    - cd /home/neofoxme/public_html/foxy && /usr/local/bin/npm install --production=false
    - cd /home/neofoxme/public_html/foxy && /usr/local/bin/npm run build
    - /bin/cp -R /home/neofoxme/public_html/foxy/dist/* /home/neofoxme/public_html/foxy/
    - chmod -R 755 /home/neofoxme/public_html/foxy
    - chmod -R 777 /home/neofoxme/public_html/foxy/api/data
